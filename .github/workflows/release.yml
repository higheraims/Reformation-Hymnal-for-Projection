name: Build & Release

on:
  push:
    tags: ["[0-9][0-9][0-9][0-9].*"]   # CalVer: 2026.06.07, 2026.06.07.1, etc.
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: make test

      - name: Build release artifacts
        run: make build

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ReformationHymnal.sps
            dist/ReformationHymnal.project
