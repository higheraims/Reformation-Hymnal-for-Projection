name: CI

on:
  pull_request:
  push:
    branches: ["main", "text-migration"]

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install measurement fonts
        # The PowerPoint build measures text to choose a stanza size. Cambria
        # and Calibri are not redistributable, so the runner gets Google's
        # metric-compatible Caladea and Carlito; build/to_pptx.py falls back to
        # them by name and the fitted size comes out identical for all 700.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            fontconfig fonts-crosextra-caladea fonts-crosextra-carlito

      - name: Install dependencies
        run: pip install -e ".[dev,pptx]"

      - name: Run tests
        run: make test

      - name: Build (smoke check)
        run: make build
